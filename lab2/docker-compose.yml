name: shophub

x-service-common: &service-common
  restart: unless-stopped
  networks: [backend]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 15s

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-shop}:${RABBITMQ_PASSWORD:-shop}@rabbitmq:5672/

x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # ---------------- infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shop}
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------- business services ----------------
  # 6 microservices = 6 independent containers. None of them waits for another
  # service at startup (only for its database / the broker), so any one of them
  # can be stopped, restarted or rebuilt without touching the others:
  #   docker compose stop payment-service      docker compose start payment-service
  auth-service:
    <<: *service-common
    container_name: auth-service
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    environment:
      <<: *common-env
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+asyncpg://auth_svc:auth_pass@postgres:5432/auth_db
      USER_SERVICE_URL: http://user-service:8000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345!}
    ports: ["8001:8000"]
    depends_on: *depends-infra

  user-service:
    <<: *service-common
    container_name: user-service
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    environment:
      <<: *common-env
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+asyncpg://user_svc:user_pass@postgres:5432/user_db
    ports: ["8002:8000"]
    depends_on: *depends-infra

  product-service:
    <<: *service-common
    container_name: product-service
    build: { context: ., dockerfile: services/product-service/Dockerfile }
    environment:
      <<: *common-env
      SERVICE_NAME: product-service
      DATABASE_URL: postgresql+asyncpg://product_svc:product_pass@postgres:5432/product_db
      SEED_DEMO_DATA: "true"
    ports: ["8003:8000"]
    depends_on: *depends-infra

  order-service:
    <<: *service-common
    container_name: order-service
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    environment:
      <<: *common-env
      SERVICE_NAME: order-service
      DATABASE_URL: postgresql+asyncpg://order_svc:order_pass@postgres:5432/order_db
      PRODUCT_SERVICE_URL: http://product-service:8000
    ports: ["8004:8000"]
    depends_on: *depends-infra

  payment-service:
    <<: *service-common
    container_name: payment-service
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    environment:
      <<: *common-env
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql+asyncpg://payment_svc:payment_pass@postgres:5432/payment_db
      MAX_PAYMENT_AMOUNT: ${MAX_PAYMENT_AMOUNT:-5000}
    ports: ["8005:8000"]
    depends_on: *depends-infra

  notification-service:
    <<: *service-common
    container_name: notification-service
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    environment:
      <<: *common-env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+asyncpg://notification_svc:notification_pass@postgres:5432/notification_db
    ports: ["8006:8000"]
    depends_on: *depends-infra

  # ---------------- edge ----------------
  api-gateway:
    <<: *service-common
    container_name: api-gateway
    build: { context: ., dockerfile: gateway/Dockerfile }
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: api-gateway
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      AUTH_SERVICE_URL: http://auth-service:8000
      USER_SERVICE_URL: http://user-service:8000
      PRODUCT_SERVICE_URL: http://product-service:8000
      ORDER_SERVICE_URL: http://order-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8000
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports: ["8080:8000"]
    # No depends_on on the services: the gateway runs even when some of them are down
    # and answers 502 only for the routes of the missing service.

networks:
  backend:

volumes:
  pgdata:
