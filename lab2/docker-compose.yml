name: shophub

# ShopHub: 6 microservices = 6 containers. Nothing else runs in Docker.
#
# All of them use ONE PostgreSQL database ("shophub") that runs on the host
# machine (the locally installed PostgreSQL). Inside it every service has its
# own schema and its own login role, and the asynchronous events between
# services go through the bus.* tables of the same database.
# Prepare the database once:  powershell -ExecutionPolicy Bypass -File scripts\setup-database.ps1
#
# Any single service can be stopped, crashed, restarted or rebuilt alone:
#   docker compose stop payment-service
#   docker compose up -d --build --no-deps payment-service

x-service: &service
  restart: unless-stopped   # a crashed service is restarted automatically by Docker
  extra_hosts:
    - "host.docker.internal:host-gateway"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 15s

x-env: &env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
  CHAOS_ENABLED: ${CHAOS_ENABLED:-true}   # enables POST /chaos/crash for the failure demo

services:
  auth-service:
    <<: *service
    container_name: auth-service
    build: { context: ., dockerfile: services/auth-service/Dockerfile }
    environment:
      <<: *env
      SERVICE_NAME: auth-service
      DATABASE_URL: postgresql+asyncpg://auth_svc:auth_pass@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/shophub
      USER_SERVICE_URL: http://user-service:8000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin12345!}
    ports: ["8001:8000"]

  user-service:
    <<: *service
    container_name: user-service
    build: { context: ., dockerfile: services/user-service/Dockerfile }
    environment:
      <<: *env
      SERVICE_NAME: user-service
      DATABASE_URL: postgresql+asyncpg://user_svc:user_pass@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/shophub
    ports: ["8002:8000"]

  product-service:
    <<: *service
    container_name: product-service
    build: { context: ., dockerfile: services/product-service/Dockerfile }
    environment:
      <<: *env
      SERVICE_NAME: product-service
      DATABASE_URL: postgresql+asyncpg://product_svc:product_pass@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/shophub
      SEED_DEMO_DATA: "true"
    ports: ["8003:8000"]

  order-service:
    <<: *service
    container_name: order-service
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    environment:
      <<: *env
      SERVICE_NAME: order-service
      DATABASE_URL: postgresql+asyncpg://order_svc:order_pass@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/shophub
      PRODUCT_SERVICE_URL: http://product-service:8000
    ports: ["8004:8000"]

  payment-service:
    <<: *service
    container_name: payment-service
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    environment:
      <<: *env
      SERVICE_NAME: payment-service
      DATABASE_URL: postgresql+asyncpg://payment_svc:payment_pass@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/shophub
      MAX_PAYMENT_AMOUNT: ${MAX_PAYMENT_AMOUNT:-5000}
    ports: ["8005:8000"]

  notification-service:
    <<: *service
    container_name: notification-service
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    environment:
      <<: *env
      SERVICE_NAME: notification-service
      DATABASE_URL: postgresql+asyncpg://notification_svc:notification_pass@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/shophub
    ports: ["8006:8000"]
